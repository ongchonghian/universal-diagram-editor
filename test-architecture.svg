<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f8ff"/>
  <rect x="50" y="50" width="300" height="200" fill="#e6f3ff" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">
    System Architecture Overview
  </text>
  <rect x="80" y="100" width="80" height="40" fill="#4a90e2" rx="5"/>
  <text x="120" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="white">
    Frontend
  </text>
  <rect x="240" y="100" width="80" height="40" fill="#4a90e2" rx="5"/>
  <text x="280" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="white">
    Backend
  </text>
  <rect x="160" y="180" width="80" height="40" fill="#4a90e2" rx="5"/>
  <text x="200" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="white">
    Database
  </text>
  <line x1="160" y1="120" x2="240" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="120" y1="140" x2="200" y2="180" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="140" x2="200" y2="180" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="200" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">
    Sample Architecture Diagram
  </text>
</svg>