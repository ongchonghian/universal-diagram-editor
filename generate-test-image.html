<!DOCTYPE html>
<html lang="en">
<head>
    <title>Generate Test Image</title>
</head>
<body>
    <canvas id="canvas" width="400" height="300"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Background
        ctx.fillStyle = '#f0f8ff';
        ctx.fillRect(0, 0, 400, 300);
        
        // Border box
        ctx.fillStyle = '#e6f3ff';
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 2;
        ctx.fillRect(50, 50, 300, 200);
        ctx.strokeRect(50, 50, 300, 200);
        
        // Title
        ctx.fillStyle = '#333';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('System Architecture Overview', 200, 80);
        
        // Boxes
        ctx.fillStyle = '#4a90e2';
        ctx.fillRect(80, 100, 80, 40);
        ctx.fillRect(240, 100, 80, 40);
        ctx.fillRect(160, 180, 80, 40);
        
        // Box labels
        ctx.fillStyle = 'white';
        ctx.font = '12px Arial';
        ctx.fillText('Frontend', 120, 125);
        ctx.fillText('Backend', 280, 125);
        ctx.fillText('Database', 200, 205);
        
        // Arrows (simplified as lines)
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(160, 120);
        ctx.lineTo(240, 120);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(120, 140);
        ctx.lineTo(200, 180);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(280, 140);
        ctx.lineTo(200, 180);
        ctx.stroke();
        
        // Footer text
        ctx.fillStyle = '#666';
        ctx.font = '10px Arial';
        ctx.fillText('Sample Architecture Diagram', 200, 250);
        
        // Create download link
        const link = document.createElement('a');
        link.download = 'test-architecture.png';
        link.href = canvas.toDataURL();
        link.textContent = 'Download Test Image';
        link.style.display = 'block';
        link.style.marginTop = '20px';
        link.style.fontSize = '18px';
        document.body.appendChild(link);
    </script>
</body>
</html>
